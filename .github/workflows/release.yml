# Release.
#
# A release is a version bump on main. Every push to main reads `Version:` from
# the plugin header; if no tag vX.Y.Z exists for it yet, the workflow runs the
# checks, builds the plugin ZIP, creates the tag and publishes a GitHub Release
# with the ZIP attached. That ZIP is what Updates\GitHubUpdater points every
# installed copy at: the update check reads the latest release, looks for an
# asset named jotform-bridge-X.Y.Z.zip, and hands its URL to WordPress. No
# asset, no update.
#
# The tag is created here, from the header, and never pushed by hand. That is
# what makes "the tag disagrees with the header" impossible rather than
# checked: there is one version, the header, and the tag is derived from it.
# It also makes the stale-script failure impossible: both assets/*.js carry the
# version in their URL, so a release whose header did not move would leave
# browsers on the previous frontend.js — but a header that did not move is not
# a release at all, and the workflow exits without doing anything.
#
# One thing is checked before anything is published, and it stops the release:
# readme.txt must carry a changelog entry for the version. It becomes the
# release body, which the plugin shows in the "View details" window.
#
# A failed release is fixed by fixing main. Nothing has been tagged, so there
# is nothing to delete; the next push to main tries again.
#
# Everything runs the same commands a person runs locally: composer check,
# bin/release-notes.php, bin/build-zip.sh.

name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Two pushes to main in quick succession must not race each other to the same
# tag. The second waits for the first, then sees the tag and exits.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Read the version from the plugin header
        id: version
        run: |
          set -euo pipefail
          version="$(grep -m1 '^ \* Version:' jotform-bridge/jotform-bridge.php | awk '{print $3}')"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: the plugin header says Version: '${version}', which is not X.Y.Z" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "v${version} is already released; nothing to do."
            echo "release=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Releasing ${version}."
            echo "release=true" >> "${GITHUB_OUTPUT}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up PHP
        if: steps.version.outputs.release == 'true'
        uses: shivammathur/setup-php@v2
        with:
          # The floor the plugin header promises. The checks have to pass on
          # it, and the ZIP does not depend on the PHP that built it.
          php-version: '8.0'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        if: steps.version.outputs.release == 'true'
        uses: ramsey/composer-install@v3

      # The same tests, lint and static analysis as on a branch; a release that
      # would have failed them is not a release.
      - name: Run the checks
        if: steps.version.outputs.release == 'true'
        run: composer check

      - name: Extract the release notes
        if: steps.version.outputs.release == 'true'
        run: php bin/release-notes.php "${{ steps.version.outputs.version }}" > "${RUNNER_TEMP}/notes.md"

      - name: Build the ZIP
        if: steps.version.outputs.release == 'true'
        run: bin/build-zip.sh

      - name: Publish the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          archive="dist/jotform-bridge-${VERSION}.zip"

          if [[ ! -f "${archive}" ]]; then
            echo "error: ${archive} was not built" >&2
            exit 1
          fi

          # --target pins the tag to the commit this run checked out, so the
          # release cannot land on a later push that raced it.
          gh release create "v${VERSION}" "${archive}" \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
