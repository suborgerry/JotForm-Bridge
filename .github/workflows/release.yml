# Release.
#
# Pushing a tag of the form vX.Y.Z publishes a GitHub Release with the plugin
# ZIP attached. That ZIP is what Updates\GitHubUpdater points every installed
# copy at: the update check reads the latest release, looks for an asset named
# jotform-bridge-X.Y.Z.zip, and hands its URL to WordPress. No asset, no update.
#
# Two things are checked before anything is published, and both stop the
# release rather than warn:
#
#   - the tag must equal the Version: in the plugin header. Both assets/*.js
#     carry the version in their URL, so a release whose header did not move
#     leaves browsers on the previous frontend.js — which computes no proof of
#     work and has its submissions refused. A tag that says 2.1.0 on a header
#     that says 2.0.0 would also never be offered as an update to anybody, since
#     WordPress compares the header, not the tag;
#   - readme.txt must carry a changelog entry for the version. It becomes the
#     release body, which the plugin shows in the "View details" window.
#
# A failed release is fixed by fixing the commit, deleting the tag and pushing
# it again: `git tag -d vX.Y.Z && git push origin :vX.Y.Z`.
#
# Everything runs the same commands a person runs locally: composer check,
# bin/release-notes.php, bin/build-zip.sh.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # The floor the plugin header promises. The checks have to pass on
          # it, and the ZIP does not depend on the PHP that built it.
          php-version: '8.0'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Check the tag against the plugin header
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"

          # The three version strings agree with each other first, so the
          # header is safe to treat as the one that speaks for all of them.
          php bin/version.php --check

          header="$(grep -m1 '^ \* Version:' jotform-bridge/jotform-bridge.php | awk '{print $3}')"

          if [[ "${tag}" != "${header}" ]]; then
            echo "error: tag ${GITHUB_REF_NAME} but the plugin header says ${header}" >&2
            echo "Run 'php bin/version.php --set ${tag}', commit, then move the tag." >&2
            exit 1
          fi

          echo "Releasing ${header}."

      # A tag does not skip CI. The same tests, lint and static analysis as on
      # a branch; a release that would have failed them is not a release.
      - name: Run the checks
        run: composer check

      - name: Extract the release notes
        run: php bin/release-notes.php "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"

      - name: Build the ZIP
        run: bin/build-zip.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="dist/jotform-bridge-${version}.zip"

          if [[ ! -f "${archive}" ]]; then
            echo "error: ${archive} was not built" >&2
            exit 1
          fi

          gh release create "${GITHUB_REF_NAME}" "${archive}" \
            --title "${version}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --verify-tag
